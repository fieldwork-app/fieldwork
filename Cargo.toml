[workspace]
members = [
    "crates/protocol",
    "crates/privacy-tracing",
    "crates/daemon",
    "crates/cli",
    "crates/relay",
    "crates/mobile-core",
]
resolver = "3"

[workspace.package]
version = "1.0.8"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-or-later"
repository = "https://github.com/iamjr15/shelly"
authors = ["Shelly contributors"]
description = "Shelly universal terminal handoff workspace."

[workspace.dependencies]
anyhow = "1"
android_logger = { version = "0.15.1", default-features = false }
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
backon = "1.6"
base64 = "0.22"
bincode = { version = "2.0.1", default-features = false, features = ["std", "serde"] }
chacha20poly1305 = "0.10"
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
crossterm = "0.29"
dashmap = "6"
data-encoding = "2"
ed25519-dalek = "2"
figment = { version = "0.10", features = ["env"] }
garde = { version = "0.22", features = ["derive", "regex"] }
interprocess = { version = "2.2", features = ["tokio"] }
# Exact to keep the validated daemon, mobile, and relay API surface reproducible.
iroh = { version = "=1.0.3", features = ["platform-verifier"] }
# Keep the relay crate on the same tested stable release as iroh's endpoint APIs.
iroh-relay = { version = "=1.0.3", features = ["server", "platform-verifier"] }
jni = "0.22.4"
# Exact because keyring patch releases can change native backend behavior and persistence semantics.
keyring = { version = "=3.6.2", features = ["apple-native", "linux-native-sync-persistent", "vendored"] }
libc = "0.2"
insta = { version = "1", features = ["yaml"] }
log = "0.4"
moka = { version = "0.12", features = ["sync"] }
ndk-context = "0.1.1"
portable-pty = "0.9"
postcard = { version = "1", features = ["use-std"] }
p256 = "0.13"
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["http-proto", "reqwest-blocking-client", "reqwest-rustls", "trace"] }
opentelemetry_sdk = { version = "0.32.0", default-features = false, features = ["trace"] }
proptest = "1"
qrcode = "0.14"
redb = "2"
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "rustls-no-provider"] }
ring = "0.17"
rmp-serde = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
service-manager = "0.11.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-opentelemetry = { version = "0.33.0", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Exact because 0.31.2 regresses the library-mode binding generator used by the Android build.
uniffi = { version = "=0.31.1", features = ["tokio"] }
unicode-width = "0.2"
uuid = { version = "1", features = ["serde", "v7"] }
vt100 = "0.16.2"
webpki-roots = "1"
alacritty_terminal = "=0.26.0"
whoami = "1.5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# uniffi's `--library` binding generator reads interface metadata from the
# cdylib's symbols, so `shelly-mobile-core` must keep them or `uniffi-bindgen`
# emits no Kotlin. This only affects the build-time artifact; AGP strips the
# packaged `.so` at APK time and `debugSymbolLevel=FULL` handles symbolication.
[profile.release.package.shelly-mobile-core]
strip = false
