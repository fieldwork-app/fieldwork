name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      core: ${{ steps.filter.outputs.core }}
      macos: ${{ steps.filter.outputs.macos }}
      packaging: ${{ steps.filter.outputs.packaging }}
      terraform: ${{ steps.filter.outputs.terraform }}
      ansible: ${{ steps.filter.outputs.ansible }}
      workflow: ${{ steps.filter.outputs.workflow }}
      relay: ${{ steps.filter.outputs.relay }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select affected areas
        id: filter
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: scripts/ci-changed-areas.sh "$BASE_SHA" "$HEAD_SHA"

  core:
    name: Core
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7 # v2.86.8
        with:
          tool: nextest
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - run: sudo apt-get update && sudo apt-get install -y expect vim
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --all-features
      - run: scripts/smoke-cli-no-args.sh
      - run: scripts/smoke-cli-doctor.sh
      - run: scripts/smoke-local-handoff.sh
      - run: node scripts/smoke-relay-otlp-loopback.mjs
      - run: scripts/smoke-relay-tls-loopback.sh

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Check Android release inputs
        run: |
          node scripts/check-android-release-optimization.mjs
          node scripts/sync-release-version.mjs --check
          node scripts/prepare-play-release-notes.mjs
          node scripts/test-play-rollout.mjs
      - name: Test and build Android
        env:
          SHELLY_RELAY_CONTROL_URL: https://relay.shelly.sh
        run: apps/android/gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest bundleRelease
      - name: Verify release crash-symbol metadata
        run: |
          set -euo pipefail
          aab=apps/android/app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 "$aab" > "$RUNNER_TEMP/shelly-aab-entries.txt"
          if ! grep -qx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' "$RUNNER_TEMP/shelly-aab-entries.txt"; then
            echo "The release AAB is missing its R8 mapping." >&2
            exit 1
          fi
          if ! grep -Eq '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/[^/]+/libshelly_mobile_core\.so\.dbg$' "$RUNNER_TEMP/shelly-aab-entries.txt"; then
            echo "The release AAB is missing Shelly native debug symbols. Embedded metadata:" >&2
            grep '^BUNDLE-METADATA/' "$RUNNER_TEMP/shelly-aab-entries.txt" >&2 || true
            exit 1
          fi

  workflow-static:
    name: Workflow Static Checks
    needs: changes
    if: needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install actionlint
        run: |
          version=1.7.12
          archive="actionlint_${version}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${version}/${archive}"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          ./actionlint -version
      - run: ./actionlint
      - run: ruby -e 'require "yaml"; YAML.load_file(".github/dependabot.yml"); YAML.load_file(".pre-commit-config.yaml"); puts "configuration yaml ok"'
      - run: bash -lc 'for script in scripts/*.sh apps/android/scripts/*.sh; do bash -n "$script" || exit 1; done; printf "shell script syntax ok\n"'
      - run: bash -lc 'for script in scripts/*.mjs; do node --check "$script" >/dev/null || exit 1; done; printf "node script syntax ok\n"'

  infrastructure:
    name: Infrastructure
    needs: changes
    if: needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ansible == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: needs.changes.outputs.terraform == 'true'
        with:
          terraform_version: 1.5.7
      - if: needs.changes.outputs.terraform == 'true'
        run: scripts/check-infra-terraform.sh
      - name: Install pinned Ansible
        if: needs.changes.outputs.ansible == 'true'
        run: python3 -m pip install --user ansible-core==2.21.3
      - name: Validate relay playbooks
        if: needs.changes.outputs.ansible == 'true'
        run: |
          ansible-playbook --syntax-check \
            -i infra/relay/ansible/inventory.ini \
            infra/relay/ansible/playbook.yml \
            -e shelly_relay_binary=/tmp/shelly-relay
          ansible-playbook --syntax-check \
            -i infra/relay/ansible/inventory.ini \
            infra/relay/ansible/rollback.yml

  macos-npm-smoke:
    name: macOS npm Smoke
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.0
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - name: Build and stage host npm binaries
        run: |
          cargo build --locked --release -p shelly-cli -p shelly-daemon
          case "$(uname -m)" in
            arm64) package=darwin-arm64 ;;
            x86_64) package=darwin-x64 ;;
            *) echo "unsupported macOS runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          install -d "packages/cli-$package/bin"
          install -m 755 target/release/shelly "packages/cli-$package/bin/shelly"
          install -m 755 target/release/shellyd "packages/cli-$package/bin/shellyd"
          codesign --force --sign - "packages/cli-$package/bin/shelly"
          codesign --force --sign - "packages/cli-$package/bin/shellyd"
      - run: node scripts/smoke-npm-local-install.mjs

  npm-packages:
    name: npm Package Metadata
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.30.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: node scripts/generate-oss-notices.mjs --check
      - run: node scripts/test-npm-dispatcher.mjs
      - run: node scripts/sync-release-version.mjs --check
      - run: node scripts/test-npm-publish-plan.mjs
      - run: node scripts/test-bun-install.mjs
      - run: node scripts/test-npm-artifact-pack.mjs

  gate:
    name: CI Gate
    if: always()
    needs:
      - changes
      - core
      - android
      - workflow-static
      - infrastructure
      - macos-npm-smoke
      - npm-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<< "$NEEDS_JSON"
          jq -e 'all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON" >/dev/null

  deploy-relay:
    name: Deploy Relay
    needs:
      - changes
      - gate
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.gate.result == 'success' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.relay == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy-relay.yml
    with:
      deploy_sha: ${{ github.sha }}
    secrets: inherit
