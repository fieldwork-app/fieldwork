name: Version Packages

on:
  push:
    branches: [main]
    paths:
      - ".changeset/**"
      - ".github/workflows/version-packages.yml"
  workflow_dispatch:

concurrency:
  group: version-packages
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  changesets:
    name: Open Changesets version PR
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - name: Open version packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm --package @changesets/cli@2.29.7 --package @changesets/changelog-github@0.5.1 dlx changeset version && node scripts/sync-release-version.mjs
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
