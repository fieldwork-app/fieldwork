name: Release npm Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to download artifacts from"
        required: true
  workflow_run:
    workflows: ["Release Rust Artifacts"]
    types: [completed]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish npm packages
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm-production
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    steps:
      - name: Resolve expected release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ steps.release_tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10.30.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.17.0

      - name: Verify package version matches release tag
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
          node scripts/sync-release-version.mjs --check
          tag="${{ steps.release_tag.outputs.tag }}"
          case "$tag" in
            v[0-9]*) ;;
            *) echo "expected a vX.Y.Z release tag, got: $tag" >&2; exit 1 ;;
          esac
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "v$version" != "$tag" ]; then
            echo "packages/cli version v$version does not match release tag $tag" >&2
            exit 1
          fi

      - name: Download GitHub Release artifacts
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh release download "${{ inputs.tag }}" \
            --pattern 'shelly-*.tar.gz' \
            --pattern 'shelly-*.tar.gz.sha256' \
            --pattern 'shelly-*.tar.gz.bundle' \
            --dir artifacts

      - name: Download Rust workflow artifacts
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh run download "${{ github.event.workflow_run.id }}" \
            --pattern 'shelly-*' \
            --dir artifacts

      - name: Verify release artifact checksums
        run: |
          set -euo pipefail
          if ! find artifacts -name '*.tar.gz.sha256' | grep -q .; then
            echo "no .tar.gz.sha256 checksum files found under artifacts/" >&2
            exit 1
          fi
          find artifacts -name '*.tar.gz.sha256' -execdir shasum -a 256 -c {} +

      - name: Verify cosign attestations
        run: |
          set -euo pipefail
          # Escape regex metacharacters in the repo slug for the identity regexp.
          # A GitHub owner/repo only contains [A-Za-z0-9._-] besides '/', so '.'
          # is the sole metacharacter to escape. (Avoid a bracket class here: a
          # leading "[." is parsed by sed as a collating symbol and never closes.)
          repo_regex="$(printf '%s' "$GITHUB_REPOSITORY" | sed 's/\./\\./g')"
          while IFS= read -r archive; do
            cosign verify-blob-attestation \
              --bundle "${archive}.bundle" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp "^https://github\.com/${repo_regex}/\.github/workflows/release-rust\.yml@" \
              --type slsaprovenance1 \
              "$archive"
          done < <(find artifacts -name '*.tar.gz')

      - name: Extract release archives
        run: |
          set -euo pipefail
          while IFS= read -r archive; do
            tar -xzf "$archive" -C artifacts
          done < <(find artifacts -name '*.tar.gz')
      - run: node scripts/prepare-npm-artifacts.mjs
      - name: Check npm publish readiness
        run: node scripts/publish-npm-packages.mjs --check-ready
      - name: Publish through npm trusted publishing
        run: node scripts/publish-npm-packages.mjs
