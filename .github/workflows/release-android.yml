name: Release Android

on:
  push:
    tags:
      - "android-v*.*.*"

concurrency:
  group: android-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  play-upload:
    name: Build and upload Play internal track
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: android-internal
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main-branch release revision
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Android artifact releases require an android-v*.*.* tag." >&2
            exit 1
          fi
      - name: Verify Android release credentials
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          SHELLY_RELAY_CONTROL_URL: ${{ secrets.SHELLY_RELAY_CONTROL_URL }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ] || \
             [ -z "$ANDROID_KEYSTORE_BASE64" ] || \
             [ -z "$ANDROID_KEYSTORE_PROPERTIES" ] || \
             [ -z "$SHELLY_RELAY_CONTROL_URL" ] || \
             [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "Firebase, Android signing, relay control URL, and Play upload secrets are required before building the Android release."
            exit 1
          fi
          case "$SHELLY_RELAY_CONTROL_URL" in
            https://*) ;;
            *)
              echo "SHELLY_RELAY_CONTROL_URL must be an https:// relay control endpoint for Android typed-code pairing."
              exit 1
              ;;
          esac
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Install pinned Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.1.12297006" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: 1.94.0
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked
      - name: Decode Firebase config
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$ANDROID_GOOGLE_SERVICES_JSON" ]; then
            echo "ANDROID_GOOGLE_SERVICES_JSON is required so the Android app can obtain FCM registration tokens."
            exit 1
          fi
          echo "$ANDROID_GOOGLE_SERVICES_JSON" > apps/android/app/google-services.json
          chmod 600 apps/android/app/google-services.json
      - name: Decode signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PROPERTIES" ]; then
            echo "ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PROPERTIES are required for release signing."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/android/app/release.keystore
          echo "$ANDROID_KEYSTORE_PROPERTIES" > apps/android/keystore.properties
          chmod 600 apps/android/app/release.keystore apps/android/keystore.properties
      - name: Resolve Android release version
        id: android-version
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/cli/package.json').version")
          if [ "${GITHUB_REF_NAME#android-v}" != "$version" ]; then
            echo "Android tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Android release versions must be plain SemVer: $version" >&2
            exit 1
          fi
          major=${BASH_REMATCH[1]}
          minor=${BASH_REMATCH[2]}
          patch=${BASH_REMATCH[3]}
          if (( minor > 999 || patch > 999 )); then
            echo "Android version components must be below 1000: $version" >&2
            exit 1
          fi
          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code > 2100000000 )); then
            echo "Android version code exceeds the Play limit: $version_code" >&2
            exit 1
          fi
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
      - name: Test and assemble release AAB
        env:
          SHELLY_ANDROID_VERSION_CODE: ${{ steps.android-version.outputs.version_code }}
          SHELLY_ANDROID_VERSION_NAME: ${{ steps.android-version.outputs.version_name }}
          SHELLY_RELAY_CONTROL_URL: ${{ secrets.SHELLY_RELAY_CONTROL_URL }}
        run: |
          node scripts/check-android-release-optimization.mjs
          node scripts/sync-release-version.mjs --check
          node scripts/prepare-play-release-notes.mjs
          node scripts/test-play-rollout.mjs
          apps/android/gradlew --no-daemon :app:lintDebug :app:testDebugUnitTest bundleRelease
      - name: Verify release AAB signature
        run: |
          set -euo pipefail
          jarsigner -verify -certs apps/android/app/build/outputs/bundle/release/app-release.aab | tee /tmp/shelly-aab-jarsigner.txt
          grep -q "jar verified" /tmp/shelly-aab-jarsigner.txt
      - name: Verify crash-symbol metadata
        run: |
          set -euo pipefail
          aab=apps/android/app/build/outputs/bundle/release/app-release.aab
          unzip -Z1 "$aab" > "$RUNNER_TEMP/shelly-aab-entries.txt"
          if ! grep -qx 'BUNDLE-METADATA/com.android.tools.build.obfuscation/proguard.map' "$RUNNER_TEMP/shelly-aab-entries.txt"; then
            echo "The release AAB is missing its R8 mapping." >&2
            exit 1
          fi
          if ! grep -Eq '^BUNDLE-METADATA/com.android.tools.build.debugsymbols/[^/]+/libshelly_mobile_core\.so\.dbg$' "$RUNNER_TEMP/shelly-aab-entries.txt"; then
            echo "The release AAB is missing Shelly native debug symbols. Embedded metadata:" >&2
            grep '^BUNDLE-METADATA/' "$RUNNER_TEMP/shelly-aab-entries.txt" >&2 || true
            exit 1
          fi
      - name: Prepare Play release notes
        run: node scripts/prepare-play-release-notes.mjs --output "$RUNNER_TEMP/play-whats-new"
      - name: Retain signed release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shelly-android-${{ steps.android-version.outputs.version_name }}
          path: |
            apps/android/app/build/outputs/bundle/release/app-release.aab
            apps/android/app/build/outputs/mapping/release/mapping.txt
            ${{ runner.temp }}/play-whats-new/whatsnew-en-US
          if-no-files-found: error
          retention-days: 90
      - name: Verify Play upload credentials
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON is required for Play upload."
            exit 1
          fi
      - name: Upload signed AAB to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.shelly.android
          releaseFiles: apps/android/app/build/outputs/bundle/release/app-release.aab
          releaseName: Shelly ${{ steps.android-version.outputs.version_name }}
          tracks: internal
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/play-whats-new
      - name: Clean Android release secrets
        if: always()
        run: rm -f apps/android/app/google-services.json apps/android/app/release.keystore apps/android/keystore.properties
